spring:
  application:
    name: blog
  datasource:
    url: jdbc:postgresql://localhost:5432/appdb
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:secret}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    hiddenmethod:
      filter:
        enabled: true

  session:
    timeout: 30m
    jdbc:
      initialize-schema: always
      table-name: SPRING_SESSION

server:
  port: 8888
  servlet:
      cookie:
        http-only: true
