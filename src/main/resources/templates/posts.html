
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Лента</title>
</head>
<body th:attr="data-theme=${currentTheme}">

<header th:replace="~{fragments/layout :: header}"></header>
<main class="page feed-page">
<div class="section-heading"><div><p class="eyebrow"><span></span> ИСТОРИИ И ИДЕИ</p><h1>Лента постов<span class="brand-dot">.</span></h1></div><p>Читайте то, что важно.</p></div>

<div class="empty-state" th:if="${posts.isEmpty()}">
    <p>Постов пока нет</p>
</div>

<div class="post-list"><div th:each="post : ${posts.content}">
    <article class="post-card">
        <div class="post-card-meta">
            <span>Автор:
                <span th:text="${post.author.username}">Имя пользователя</span>
            </span>
            <small th:attr="data-date=${post.createdAt}" th:text="${post.createdAt}">Дата публикации</small>
        </div>
        <h2 th:text="${post.title}">Название поста</h2>

        <p th:text="${#strings.abbreviate(post.content, 150)}">
            Краткое содержание
        </p>

        <p>
            <a th:href="@{/posts/{id}(id=${post.id})}">
                Читать пост <span aria-hidden="true">↗</span>
            </a>
        </p>
    </article>
</div></div>

<div class="pagination" th:if="${posts.totalPages > 1}">

    <a th:if="${posts.hasPrevious()}"
       th:href="@{/posts(page=${posts.number - 1}, size=${posts.size})}">
        Назад
    </a>

    <span th:each="pageNumber : ${#numbers.sequence(0, posts.totalPages - 1)}">

        <strong th:if="${pageNumber == posts.number}"
                th:text="${pageNumber + 1}"></strong>

        <a th:unless="${pageNumber == posts.number}"
           th:href="@{/posts(page=${pageNumber}, size=${posts.size})}"
           th:text="${pageNumber + 1}"></a>

    </span>

    <a th:if="${posts.hasNext()}"
       th:href="@{/posts(page=${posts.number + 1}, size=${posts.size})}">
        Вперёд
    </a>

</div>

<p class="feed-count">
    Всего постов:
    <span th:text="${posts.totalElements}">0</span>
</p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/date.js}" defer></script>

</body>
</html>
