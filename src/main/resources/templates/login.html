<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Логин</title>
</head>
<body th:attr="data-theme=${currentTheme}">

<header th:replace="~{fragments/layout :: header}"></header>
<main class="page form-page"><div class="form-card"><p class="eyebrow"><span></span> С РАДОСТЬЮ ВИДИМ ВАС СНОВА</p>
<h1>Войти в блог<span class="brand-dot">.</span></h1>
<p class="muted">Продолжайте читать и делиться своими историями.</p>

<form th:action="@{/auth/login}" method="post">

    <label for="loginInput">Имя пользователя или email</label>
    <input id="loginInput" type="text" name="loginInput" required th:value="${loginRequest?.loginInput}">
    <div th:if="${loginRequest != null}" th:object="${loginRequest}">
        <p class="field-error" th:if="${#fields.hasErrors('loginInput')}" th:errors="*{loginInput}" role="alert"></p>
    </div>

    <label for="password">Пароль</label>
    <input id="password" type="password" name="password" required>
    <div th:if="${loginRequest != null}" th:object="${loginRequest}">
        <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}" role="alert"></p>
    </div>

    <button type="submit">Войти <span aria-hidden="true">↗</span></button>

</form>
<p class="form-footnote">Ещё нет аккаунта? <a th:href="@{/auth/register}">Зарегистрироваться →</a></p>
</div></main>
<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
