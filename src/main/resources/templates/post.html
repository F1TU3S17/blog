
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title th:text="${post.title}">Пост</title>

</head>
<body th:attr="data-theme=${currentTheme}">
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page detail-page" id="post-page" th:attr="data-post-id=${post.id},data-posts-url=@{/posts},data-csrf-token=${_csrf?.token},data-csrf-header=${_csrf?.headerName}">
<a class="back-link" th:href="@{/posts}">← Назад к ленте</a>

<article class="detail-card" id="post-view">
    <p class="eyebrow"><span></span> ИСТОРИЯ</p>

    <h1 th:text="${post.title}">Название поста</h1>

    <p>
        Автор:
        <span th:text="${post.author.username}">Автор</span>
    </p>

    <small th:attr="data-date=${post.createdAt}" th:text="${post.createdAt}">Дата</small>

    <hr>

    <div class="post-content"
         th:text="${post.content}">
        Содержимое поста
    </div>

    <div class="actions"
         th:if="${user != null}">

        <button type="button"
                th:if="${user.id == post.author.id}"
                onclick="showEditForm()">
            Редактировать
        </button>

        <button type="button"
                th:if="${user.id == post.author.id or user.hasRole(T(ru.sfedu.blog.entity.UserRoleEnum).ADMIN)}"
                onclick="deletePost()">
            Удалить
        </button>

    </div>
</article>

<section id="edit-section"
         class="edit-section hidden"
         th:if="${user != null and user.id == post.author.id}">

    <h2>Редактирование поста</h2>

    <form th:action="@{/posts/{id}(id=${post.id})}"
          method="post">

        <input type="hidden" name="_method" value="PUT">

        <label for="title">Заголовок</label>
        <input type="text"
               id="title"
               name="title"
               th:value="${post.title}"
               maxlength="100"
               required>

        <label for="content">Содержание</label>
        <textarea id="content"
                  name="content"
                  required
                  th:text="${post.content}"></textarea>

        <div class="actions">
            <button type="submit">Сохранить</button>

            <button type="button" onclick="hideEditForm()">
                Отмена
            </button>
        </div>
    </form>
</section>

<section class="comments-section" aria-labelledby="comments-heading">
    <div class="comments-heading">
        <h2 id="comments-heading">Комментарии <span th:text="${#lists.size(post.comments)}">0</span></h2>
    </div>

    <div class="comment-compose" th:if="${user != null}">
        <h3>Присоединиться к обсуждению</h3>
        <form th:action="@{/comments/{id}(id=${post.id})}" method="post">
            <label for="comment-text">Ваш комментарий</label>
            <textarea id="comment-text" name="text" maxlength="1000" required
                      placeholder="Поделитесь своим мнением"></textarea>
            <button type="submit">Отправить комментарий</button>
        </form>
    </div>
    <p class="comment-login" th:if="${user == null}">
        <a th:href="@{/auth/login}">Войдите</a>, чтобы присоединиться к обсуждению.
    </p>

    <p class="comments-empty" th:if="${#lists.isEmpty(post.comments)}">Пока нет комментариев. Будьте первым!</p>
    <div class="comment-list" th:unless="${#lists.isEmpty(post.comments)}">
        <article class="comment-card" th:each="comment : ${post.comments}">
            <div class="comment-header">
                <div class="comment-meta">
                    <strong th:text="${comment.authorUsername}">Автор</strong>
                    <time th:attr="datetime=${comment.createdAt},data-date=${comment.createdAt}" th:text="${comment.createdAt}">Дата</time>
                </div>
                <form class="comment-delete-form" th:if="${user != null and (user.id == comment.authorId or user.hasRole(T(ru.sfedu.blog.entity.UserRoleEnum).ADMIN))}"
                      th:action="@{/comments/{id}(id=${comment.id})}" method="post">
                    <button class="comment-delete" type="submit" aria-label="Удалить комментарий" title="Удалить комментарий">
                        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 13h12l1-13M9 7V4h6v3"/></svg>
                    </button>
                </form>
            </div>
            <p class="comment-text" th:text="${comment.text}">Текст комментария</p>
        </article>
    </div>
</section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/date.js}" defer></script>
<script th:src="@{/js/post.js}" defer></script>

</body>
</html>
