
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title th:text="${post.title}">Пост</title>

</head>
<body th:attr="data-theme=${currentTheme}">
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page detail-page" id="post-page" th:attr="data-post-id=${post.id},data-posts-url=@{/posts},data-csrf-token=${_csrf?.token},data-csrf-header=${_csrf?.headerName}">
<a class="back-link" th:href="@{/posts}">← Назад к ленте</a>

<article class="detail-card" id="post-view">
    <p class="eyebrow"><span></span> ИСТОРИЯ</p>

    <h1 th:text="${post.title}">Название поста</h1>

    <p>
        Автор:
        <span th:text="${post.author.username}">Автор</span>
    </p>

    <small th:attr="data-date=${post.createdAt}" th:text="${post.createdAt}">Дата</small>

    <hr>

    <div class="post-content"
         th:text="${post.content}">
        Содержимое поста
    </div>

    <div class="actions"
         th:if="${user != null}">

        <button type="button"
                th:if="${user.id == post.author.id}"
                onclick="showEditForm()">
            Редактировать
        </button>

        <button type="button"
                th:if="${user.id == post.author.id or user.hasRole(T(ru.sfedu.blog.entity.UserRoleEnum).ADMIN)}"
                onclick="deletePost()">
            Удалить
        </button>

    </div>
</article>

<section id="edit-section"
         class="edit-section hidden"
         th:if="${user != null and user.id == post.author.id}">

    <h2>Редактирование поста</h2>

    <form th:action="@{/posts/{id}(id=${post.id})}"
          method="post">

        <input type="hidden" name="_method" value="PUT">

        <label for="title">Заголовок</label>
        <input type="text"
               id="title"
               name="title"
               th:value="${post.title}"
               maxlength="100"
               required>

        <label for="content">Содержание</label>
        <textarea id="content"
                  name="content"
                  required
                  th:text="${post.content}"></textarea>

        <div class="actions">
            <button type="submit">Сохранить</button>

            <button type="button" onclick="hideEditForm()">
                Отмена
            </button>
        </div>
    </form>
</section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/date.js}" defer></script>
<script th:src="@{/js/post.js}" defer></script>

</body>
</html>
